data:
  batch_size: 64
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 150
  image_folder: iic/
  num_workers: 0
  pin_mem: true
  root_path: datasets
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
logging:
  folder: logs_PKT_chunks/iic-train-l2-seed0-KNN-ep1000
  # folder: logs_PKT_chunks_different_seeds/iic-train-l2-pkt-chunks-seed4/
  write_tag: jepa-iic
  checkpoint_freq: 100 # new addition
  logging_frequency: 1 # defaults to 3, more concise logs
  output_file: oiic-evaluate-l2-wPlot.out
  plot_matrices: false # defaults to true
  use_tensorboard: true
  tensorboard_dir: eval_tb/ # possibly not used
mask:
  allow_overlap: false
  aspect_ratio: 
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 1
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 15
  pred_mask_scale:
  - 0.15                    # default: 0.15
  - 0.2                     # default: 0.2
meta:
  copy_data: false          # default: false
  load_checkpoint: true
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  # this should append the -ep500.pth.tar appropriately
  # to the read_checkpoint
  read_checkpoint: jepa-iic   # default: null
  use_bfloat16: false       # default: true
  evaluate_latest_only: false # defaults: true
optimization:
  ema:
  - 0.996                   # default: 0.996
  - 1.0                     # default: 1.
  epochs: 500
  final_lr: 1.0e-06         # default: 1.0e-06
  final_weight_decay: 0.4   # default: 0.4
  ipe_scale: 1.0
  lr: 0.001                 # default: 1e-3
  start_lr: 0.0002          # default: 2e-4
  warmup: 40
  weight_decay: 0.04        # default: 0.04
  loss_function: L2
  # message: "third try at full PKT for reproducibility"
  evaluate: True           # get similarity distributions?
sensitivity:
  enabled: true
  corruption_ratios: [0.0, 0.05, 0.10, 0.20, 0.30]
  objectives: ["L2"]
# Von Neumann Entropy - MSE per patch sorted
